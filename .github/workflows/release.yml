# Build the SysStatus APK and publish or refresh a GitHub release (maintainer only, MANUAL - never runs by itself).
#
# Settings live in  .github/workflows/release.json  (tag, title, prerelease, latest).
# Edit it, push, then: Actions -> Release -> Run workflow.
#
# What happens:
#   * The tag in release.json is NEW (no release for it yet):
#       the APK is built, a new tag + a new release are created at the current commit,
#       the title comes from release.json and the notes are AUTO-GENERATED by GitHub.
#   * The release for that tag ALREADY EXISTS:
#       the APK is rebuilt, the tag is moved to the current commit and the APK is replaced.
#       The title and the notes are NOT touched (prerelease / latest flags follow release.json).
#   * An older, different tag is never changed.
#
# The APK's versionName comes from the tag (v1.2.0 -> 1.2.0) and versionCode from the run number.
#
# WARNING: moving an existing tag changes what people who pinned it will get.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build APK and create or refresh release
    # Only runs in the main SysStatus repo, never in forks. Change the name if your repo differs.
    if: github.repository == 'bhawan-kavinda/SysStatus'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and check release.json
        run: |
          F=".github/workflows/release.json"
          [ -f "$F" ] || { echo "::error::$F not found"; exit 1; }
          jq -e . "$F" >/dev/null || { echo "::error::$F is not valid JSON"; exit 1; }

          TAG=$(jq -r '.tag // ""' "$F")
          PRE=$(jq -r 'if has("prerelease") then .prerelease else false end' "$F")
          LATEST=$(jq -r 'if has("latest") then .latest else true end' "$F")

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::tag must look like v1.2.0 or v1.2.0-beta.1, got: $TAG"
            exit 1
          fi
          case "$PRE" in true|false) ;; *) echo "::error::prerelease must be true or false"; exit 1 ;; esac
          case "$LATEST" in true|false) ;; *) echo "::error::latest must be true or false"; exit 1 ;; esac

          # a -beta tag must be a prerelease, and a normal tag must not be
          case "$TAG" in
            *-beta.*) IS_BETA=true ;;
            *)        IS_BETA=false ;;
          esac
          if [ "$IS_BETA" != "$PRE" ]; then
            echo "::error::tag $TAG and prerelease=$PRE do not match (a -beta tag needs prerelease true, a normal tag needs false)"
            exit 1
          fi
          if [ "$PRE" = "true" ] && [ "$LATEST" = "true" ]; then
            echo "::warning::A prerelease cannot be Latest - latest is ignored."
            LATEST=false
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "Tag: $TAG | prerelease: $PRE | latest: $LATEST"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. The release APK will be signed with a temporary debug key, so it cannot be installed over an APK signed with another key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$GITHUB_RUN_NUMBER"

          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          [ -n "$SRC" ] || { echo "::error::No APK found after build"; exit 1; }
          APK="SysStatus-$TAG.apk"
          cp "$SRC" "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Create or refresh the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT=$(git rev-parse --short HEAD)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists -> moving the tag and replacing the APK (title and notes untouched)."
            echo "::warning::Tag $TAG is moved to $SHORT. Anyone who pinned $TAG gets this code."
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --prerelease="$PRE" --latest="$LATEST"
          else
            echo "Release $TAG is new -> creating it with auto-generated notes."
            TITLE=$(jq -r '.title // ""' .github/workflows/release.json | head -n1)
            [ -n "$TITLE" ] || TITLE="$TAG"
            # a tag that exists without a release is moved here; a missing tag is created by gh
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::warning::Tag $TAG already existed without a release - moved to $SHORT."
              git tag -f "$TAG"
              git push -f origin "refs/tags/$TAG"
            fi
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --prerelease="$PRE" \
              --latest="$LATEST"
          fi
          echo "Done: $TAG at $SHORT"
