<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="System Status banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A8C"/>
      <stop offset="1" stop-color="#061653"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="mask"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- app icon -->
  <g transform="translate(80 125) scale(2.0833) translate(-18 -18)">
    <g clip-path="url(#mask)">
      <rect width="108" height="108" fill="#0A2A8C"/>
      <path d="M9,0 L9,108 M19,0 L19,108 M29,0 L29,108 M39,0 L39,108 M49,0 L49,108 M59,0 L59,108 M69,0 L69,108 M79,0 L79,108 M89,0 L89,108 M99,0 L99,108 M0,9 L108,9 M0,19 L108,19 M0,29 L108,29 M0,39 L108,39 M0,49 L108,49 M0,59 L108,59 M0,69 L108,69 M0,79 L108,79 M0,89 L108,89 M0,99 L108,99" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.8"/>
      <path fill="#FFFFFF" fill-rule="evenodd" d="M31,63.9 A23,19.4 0 0 1 77,63.9 Z M41.5,55.4 a1.9,1.9 0 1 0 3.8,0 a1.9,1.9 0 1 0 -3.8,0 Z M62.7,55.4 a1.9,1.9 0 1 0 3.8,0 a1.9,1.9 0 1 0 -3.8,0 Z"/>
      <path d="M42.7,46 L38.9,39.4 M65.3,46 L69.1,39.4" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="80" y="125" width="150" height="150" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- title -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="270" y="185" font-size="64" font-weight="700" fill="#FFFFFF">System Status</text>
    <text x="272" y="228" font-size="23" fill="#BFD0FF">Live battery, memory and CPU stats in real time</text>

    <!-- chips -->
    <g font-size="16" font-weight="600" fill="#FFFFFF">
      <rect x="272" y="262" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="318" y="284" text-anchor="middle">No root</text>
      <rect x="374" y="262" width="112" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="430" y="284" text-anchor="middle">No internet</text>
      <rect x="496" y="262" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="555" y="284" text-anchor="middle">Open source</text>
      <rect x="624" y="262" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.14"/>
      <text x="699" y="284" text-anchor="middle">Floating window</text>
    </g>

    <!-- gauges -->
    <g text-anchor="middle" fill="#FFFFFF">
      <g transform="translate(900 180)">
        <circle r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="9"/>
        <circle r="44" fill="none" stroke="#1BAF7A" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.7 276.5" transform="rotate(-90)"/>
        <text y="9" font-size="26" font-weight="700">82%</text>
        <text y="82" font-size="16" fill="#BFD0FF">Battery</text>
      </g>
      <g transform="translate(1010 180)">
        <circle r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="9"/>
        <circle r="44" fill="none" stroke="#EB6834" stroke-width="9" stroke-linecap="round" stroke-dasharray="168.7 276.5" transform="rotate(-90)"/>
        <text y="9" font-size="26" font-weight="700">61%</text>
        <text y="82" font-size="16" fill="#BFD0FF">Memory</text>
      </g>
      <g transform="translate(1120 180)">
        <circle r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="9"/>
        <circle r="44" fill="none" stroke="#2A78D6" stroke-width="9" stroke-linecap="round" stroke-dasharray="94 276.5" transform="rotate(-90)"/>
        <text y="9" font-size="26" font-weight="700">34%</text>
        <text y="82" font-size="16" fill="#BFD0FF">CPU</text>
      </g>
    </g>
  </g>
</svg>
